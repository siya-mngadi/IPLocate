name: Publish NuGet Package

on:
  push:
    tags:
      - "v*.*.*" # Trigger on tags like v0.1.0, v0.2.1, etc.

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x" # Your target .NET version

      # 3️⃣ Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # 4️⃣ Build the project
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # 5️⃣ Run tests
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      # 6️⃣ Pack the NuGet package
      - name: Pack
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          dotnet pack --configuration Release --no-build --output ./nupkg /p:PackageVersion=$VERSION

      # 7️⃣ Publish to NuGet.org
      - name: Publish
        run: |
          for pkg in ./nupkg/*.nupkg; do
            echo "Pushing $pkg to NuGet.org..."
            dotnet nuget push "$pkg" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
